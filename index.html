    <!-- Custom calendar modal styles -->
    <style>
      /* Overlay that covers the entire viewport */
      #custom-calendar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.6);
        z-index: 99999;
        justify-content: center;
        align-items: center;
      }
      
      /* Calendar container */
      #calendar-modal {
        position: relative;
        width: 95%;
        max-width: 1000px;
        height: 85vh;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }
      
      /* Close button */
      #calendar-close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 30px;
        height: 30px;
        background: white;
        border-radius: 50%;
        border: none;
        font-size: 20px;
        line-height: 30px;
        text-align: center;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }
      
      /* Calendar iframe */
      #calendar-iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      
      /* Loading spinner */
      .calendar-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
      }
      
      .calendar-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #9b87f5;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .hidden {
        display: none;
      }
    </style>
    
    <!-- Calendar modal HTML -->
    <div id="custom-calendar-overlay">
      <div id="calendar-modal">
        <button id="calendar-close-btn" aria-label="Close calendar">×</button>
        <!-- Loading spinner -->
        <div id="calendar-loader" class="calendar-loader">
          <div class="calendar-spinner"></div>
        </div>
        <!-- Direct link to Cal.com -->
        <iframe 
          id="calendar-iframe" 
          title="Calendar booking" 
          src="https://cal.com/team-powered-by-dfbtbb/get-started-today" 
          frameborder="0"
          allowfullscreen>
        </iframe>
      </div>
    </div>
    
    <!-- Custom calendar scheduling script -->
    <script>
    (function() {
      // Wait for DOM to fully load
      document.addEventListener('DOMContentLoaded', function() {
        console.log('🔄 Initializing custom calendar handlers');
        
        // Get overlay and iframe elements
        const overlay = document.getElementById('custom-calendar-overlay');
        const iframe = document.getElementById('calendar-iframe');
        const closeBtn = document.getElementById('calendar-close-btn');
        const loader = document.getElementById('calendar-loader');
        
        // Handle iframe loading states
        iframe.onload = function() {
          console.log('Calendar iframe loaded successfully');
          loader.classList.add('hidden');
        };
        
        iframe.onerror = function() {
          console.error('Calendar iframe failed to load');
          // Show error message in the loader
          loader.innerHTML = '<div><h3>Error loading calendar</h3><p>Please try refreshing or contact support.</p></div>';
        };
        
        // Function to open calendar modal
        window.openCalendarModal = function() {
          // Show the overlay and loader
          overlay.style.display = 'flex';
          loader.classList.remove('hidden');
          
          // Make sure iframe is properly loaded
          if (iframe.src !== 'https://cal.com/team-powered-by-dfbtbb/get-started-today') {
            iframe.src = 'https://cal.com/team-powered-by-dfbtbb/get-started-today';
          }
          
          console.log('📅 Calendar modal opened');
          
          // If iframe doesn't load within 5 seconds, provide a direct link
          setTimeout(function() {
            if (!loader.classList.contains('hidden')) {
              loader.innerHTML = '<div><h3>Taking too long to load?</h3>' + 
                                '<p><a href="https://cal.com/team-powered-by-dfbtbb/get-started-today" ' + 
                                'target="_blank" style="color:#9b87f5;">Click here to open in a new tab</a></p></div>';
            }
          }, 5000);
        };
        
        // Function to close calendar modal
        function closeCalendarModal() {
          overlay.style.display = 'none';
          console.log('📅 Calendar modal closed');
        }
        
        // Close when clicking close button
        closeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          closeCalendarModal();
        });
        
        // Close when clicking outside the modal
        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) {
            closeCalendarModal();
          }
        });
        
        // Super aggressive approach - capture ALL clicks on the page
        // and if they match our criteria, open the calendar
        document.addEventListener('click', function(event) {
          let target = event.target;
          let isCalendarButton = false;
          
          // Check if clicked element or any of its parents is a calendar button
          while (target && target !== document && !isCalendarButton) {
            // Check for common button elements
            if (target.tagName === 'BUTTON' || target.tagName === 'A' || 
                target.classList && (
                  target.classList.contains('button') || 
                  target.classList.contains('btn') ||
                  target.classList.contains('cal-btn')
                )) {
              
              // Check for cal.com attribute
              if (target.hasAttribute('data-cal-link')) {
                isCalendarButton = true;
                break;
              }
              
              // Check button text (if available)
              if (target.textContent) {
                const text = target.textContent.toLowerCase();
                if (text.includes('get started') || 
                    text.includes('schedule') || 
                    text.includes('demo') || 
                    text.includes('book') || 
                    text.includes('call') ||
                    text.includes('experience the benefits')) {
                  isCalendarButton = true;
                  break;
                }
              }
              
              // Check for primary button styling
              if (target.className && typeof target.className === 'string') {
                if (target.className.includes('primary') || 
                    target.className.includes('9b87f5') ||
                    target.className.includes('purple')) {
                  // This is likely a primary action button
                  const nearestHeading = findNearestHeading(target);
                  if (nearestHeading) {
                    const headingText = nearestHeading.textContent.toLowerCase();
                    if (headingText.includes('ready') || 
                        headingText.includes('start') || 
                        headingText.includes('schedule') || 
                        headingText.includes('today')) {
                      isCalendarButton = true;
                      break;
                    }
                  }
                }
              }
            }
            
            target = target.parentNode;
          }
          
          // If calendar button detected, open modal
          if (isCalendarButton) {
            event.preventDefault();
            event.stopPropagation();
            console.log('📅 Calendar button detected and clicked!', event.target);
            openCalendarModal();
            return false;
          }
        }, true); // Use capture phase to get events before React
        
        // Helper function to find nearest heading element
        function findNearestHeading(element) {
          let current = element;
          let maxSteps = 5; // Only look 5 levels up max
          
          // Look for headings in siblings first
          while (current && maxSteps > 0) {
            // Check previous siblings
            let sibling = current.previousElementSibling;
            while (sibling) {
              if (sibling.tagName && /^H[1-6]$/.test(sibling.tagName)) {
                return sibling;
              }
              sibling = sibling.previousElementSibling;
            }
            
            // Move up to parent
            current = current.parentElement;
            maxSteps--;
            
            // Check if parent contains a heading
            if (current) {
              const headings = current.querySelectorAll('h1, h2, h3, h4, h5, h6');
              if (headings.length > 0) {
                return headings[0];
              }
            }
          }
          
          return null;
        }
        
        console.log('✅ Calendar modal and handlers initialized successfully');
      });
    })();
    </script>
