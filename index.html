    <!-- Cal.com immediate initialization -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        console.log('🔄 Initializing Cal.com');
        if (typeof Cal !== 'undefined' && Cal.hasOwnProperty('init')) {
          Cal.init();
          console.log('✅ Cal.com initialized directly');
        } else {
          console.log('⚠️ Cal global object not available, waiting for script load');
          setTimeout(function() {
            if (typeof Cal !== 'undefined' && Cal.hasOwnProperty('init')) {
              Cal.init();
              console.log('✅ Cal.com initialized after delay');
            }
          }, 1000); // Give time for embed.js to load
        }
      });
    </script>
    
    <!-- Cal.com Calendar Handler Script -->
    <script>
    (function() {
      document.addEventListener('DOMContentLoaded', function() {
        console.log('🔄 Initializing calendar link handlers');
        const calendarUrl = 'https://cal.com/team-powered-by-dfbtbb/get-started-today';
        
        // Function to open the calendar - priority: modal, fallback: new tab
        window.openCalendarModal = function() {
          if (window.Cal && typeof window.Cal === 'function') {
            try {
              console.log('📅 Opening calendar modal');
              window.Cal('modal', {
                calLink: 'team-powered-by-dfbtbb/get-started-today',
                config: {
                  layout: 'month_view',
                  theme: 'light'
                }
              });
              return true;
            } catch (err) {
              console.error('Error opening Cal.com modal:', err);
            }
          }
          // Fallback: open in new tab
          console.log('📅 Fallback: Opening calendar in new tab');
          window.open(calendarUrl, '_blank');
        };
        
        // Super aggressive approach - capture ALL clicks on the page
        // and if they match our criteria, open the calendar
        document.addEventListener('click', function(event) {
          let target = event.target;
          let isCalendarButton = false;
          
          // Check if clicked element or any of its parents is a calendar button
          while (target && target !== document && !isCalendarButton) {
            // Check for common button elements
            if (target.tagName === 'BUTTON' || target.tagName === 'A' || 
                target.classList && (
                  target.classList.contains('button') || 
                  target.classList.contains('btn') ||
                  target.classList.contains('cal-btn')
                )) {
              
              // Check for cal.com attribute
              if (target.hasAttribute('data-cal-link')) {
                isCalendarButton = true;
                break;
              }
              
              // Check button text (if available)
              if (target.textContent) {
                const text = target.textContent.toLowerCase().trim();
                if (text.includes('get started') || 
                    text.includes('get started now') || 
                    text.includes('get started today') || 
                    text.includes('schedule a demo') || 
                    text.includes('schedule') || 
                    text.includes('demo') || 
                    text.includes('book') || 
                    text.includes('call') ||
                    text.includes('experience the benefits')) {
                  isCalendarButton = true;
                  break;
                }
              }
              
              // Check for primary button styling
              if (target.className && typeof target.className === 'string') {
                if (target.className.includes('primary') || 
                    target.className.includes('9b87f5') ||
                    target.className.includes('purple')) {
                  // This is likely a primary action button
                  const nearestHeading = findNearestHeading(target);
                  if (nearestHeading) {
                    const headingText = nearestHeading.textContent.toLowerCase();
                    if (headingText.includes('ready') || 
                        headingText.includes('start') || 
                        headingText.includes('schedule') || 
                        headingText.includes('today')) {
                      isCalendarButton = true;
                      break;
                    }
                  }
                }
              }
            }
            
            target = target.parentNode;
          }
          
          // If calendar button detected, add Cal data attribute and let Cal.com handle it
          if (isCalendarButton && !target.hasAttribute('data-cal-link')) {
            // Add Cal.com data attribute so their script will handle the click
            target.setAttribute('data-cal-link', 'team-powered-by-dfbtbb/get-started-today');
            target.setAttribute('data-cal-namespace', 'powered-by');
            console.log('📅 Added Cal.com attributes to button:', target);
          }
        }, true); // Use capture phase to get events before React
        
        // Helper function to find nearest heading element
        function findNearestHeading(element) {
          let current = element;
          let maxSteps = 5; // Only look 5 levels up max
          
          // Look for headings in siblings first
          while (current && maxSteps > 0) {
            // Check previous siblings
            let sibling = current.previousElementSibling;
            while (sibling) {
              if (sibling.tagName && /^H[1-6]$/.test(sibling.tagName)) {
                return sibling;
              }
              sibling = sibling.previousElementSibling;
            }
            
            // Move up to parent
            current = current.parentElement;
            maxSteps--;
            
            // Check if parent contains a heading
            if (current) {
              const headings = current.querySelectorAll('h1, h2, h3, h4, h5, h6');
              if (headings.length > 0) {
                return headings[0];
              }
            }
          }
          
          return null;
        }
        
        console.log('✅ Calendar link handlers initialized successfully');
      });
    })();
